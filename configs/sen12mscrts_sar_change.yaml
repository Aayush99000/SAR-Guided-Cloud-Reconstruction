# SAR change gating for the temporal model: each input date's backscatter
# change to the target date (VV, VH; dB, 5×5 box-filtered) is an extra input
# of the per-date encoder and a learned bias on the attention over dates.
# Needs the target date's SAR and temporal attention — merge after both:
#   --config configs/sen12mscrts.yaml configs/sen12mscrts_tsar.yaml \
#            configs/sen12mscrts_temporal.yaml configs/sen12mscrts_sar_change.yaml
# Compare against tsar_temporal (same model without the explicit change map).

paths:
  bridge_ckpt_dir: ${paths.output_root}/checkpoints/bridge_ts_tsar_temporal_change

model:
  sar_change: true
