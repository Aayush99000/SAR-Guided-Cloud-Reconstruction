# Ablation: feed the composite's cloud mask (1 = cloudy in every input date)
# to the network as an extra input channel.  Merge after the TS overlay:
#   --config configs/sen12mscrts.yaml configs/sen12mscrts_mask.yaml
# Everything else (data, schedule, epochs, eval protocol) matches bridge_ts_v1.
# The slurm scripts set the checkpoint directory per experiment.

paths:
  bridge_ckpt_dir: ${paths.output_root}/checkpoints/bridge_ts_mask

model:
  mask_input: true
