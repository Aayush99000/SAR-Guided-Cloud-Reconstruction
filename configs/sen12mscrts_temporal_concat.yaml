# Baseline for sen12mscrts_temporal.yaml: the same per-date inputs (stack,
# per-date masks, date offsets) concatenated to the encoder input instead of
# encoded and fused by attention.  Merge after the TS overlay:
#   --config configs/sen12mscrts.yaml configs/sen12mscrts_temporal_concat.yaml

paths:
  bridge_ckpt_dir: ${paths.output_root}/checkpoints/bridge_ts_temporal_concat

model:
  mask_input: true
  temporal_mode: concat
